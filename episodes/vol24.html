<script>
async function init() {
    try {
        // データの読み込み
        const res = await fetch('movies.json');
        if (!res.ok) throw new Error('JSON load failed');
        const movies = await res.json();
        
        // --- 1. データ集計 ---
        const countryStats = {};
        const decadeStats = {};
        
        movies.forEach(m => {
            countryStats[m.category] = (countryStats[m.category] || 0) + 1;
            const decade = Math.floor(m.year / 10) * 10 + "s";
            decadeStats[decade] = (decadeStats[decade] || 0) + 1;
        });

        // 国別データを多い順にソート
        const sortedCountryStatsArray = Object.entries(countryStats).sort((a, b) => b[1] - a[1]);

        document.getElementById('category-list').textContent = 
            sortedCountryStatsArray.map(([k, v]) => `【${k}】${v}`).join('、');

        // --- 2. グラフ描画 (Chart.js) ---
        Chart.defaults.color = '#ccc';

        // 国別円グラフ
        const colors = [
            '#ff00ff', '#00f2ff', '#00ff70', '#ffaa00', '#7000ff', 
            '#ff0055', '#aaff00', '#00aaff', '#ff5500', '#5500ff', 
            '#0055ff', '#ff00aa', '#ffff00', '#00ffff', '#fff', '#888'
        ];
        new Chart(document.getElementById('countryChart'), {
            type: 'doughnut',
            data: {
                labels: sortedCountryStatsArray.map(item => item[0]),
                datasets: [{
                    data: sortedCountryStatsArray.map(item => item[1]),
                    backgroundColor: colors.slice(0, sortedCountryStatsArray.length),
                    borderWidth: 0
                }]
            },
            options: { 
                aspectRatio: 1.2,
                plugins: { title: { display: true, text: '国別シェア', color: '#00f2ff', font: {size: 16} } }
            }
        });

        // 年代別棒グラフ
        const sortedDecades = Object.keys(decadeStats).sort();
        new Chart(document.getElementById('yearChart'), {
            type: 'bar',
            data: {
                labels: sortedDecades,
                datasets: [{
                    label: '作品数',
                    data: sortedDecades.map(d => decadeStats[d]),
                    backgroundColor: '#ff00ff'
                }]
            },
            options: {
                aspectRatio: 1.2,
                plugins: { title: { display: true, text: '年代別分布', color: '#ff00ff', font: {size: 16} }, legend: { display: false } },
                scales: { y: { beginAtZero: true, grid: { color: '#222' } }, x: { grid: { display: false } } }
            }
        });

        // --- 3. リスト生成 ---
        const indexNav = document.getElementById('movie-index');
        const listDiv = document.getElementById('movie-list');
        const allMoviesGrid = document.getElementById('all-movies-grid');

        movies.forEach((m, i) => {
            // 10作ごとにテーマカラーを設定（円グラフ用の colors 配列を再利用）
            // i=0~9は色0, i=10~19は色1...のように自動で割り当て
            const themeColor = colors[Math.floor(i / 10)] || '#ccc';

            const displayOrder = m.order > 30 ? "次点" : String(m.order).padStart(2, '0');

            // 目次
            const idxLink = document.createElement('a');
            idxLink.href = `#m${m.id}`;
            idxLink.textContent = `${displayOrder}. ${m.title}`;
            idxLink.style.color = themeColor;
            indexNav.appendChild(idxLink);

            // 更新日時の処理
            let updateDateHtml = '';
            if (m.updated_at && m.updated_at !== '2000-01-01T00:00:00' && m.updated_at !== '-') {
                const date = new Date(m.updated_at);
                const formattedDate = `${date.getFullYear()}.${String(date.getMonth() + 1).padStart(2, '0')}.${String(date.getDate()).padStart(2, '0')}`;
                updateDateHtml = `<p class="update-date">最終更新: ${formattedDate}</p>`;
            }

            // カード
            const section = document.createElement('section');
            section.className = 'movie-card';
            section.id = `m${m.id}`;
            section.setAttribute('data-rank', m.order);
            section.innerHTML = `
                <div class="card-header" style="border-bottom: 2px solid ${themeColor};">
                    ${updateDateHtml}
                    <h3 style="color: ${themeColor}">
                        ${displayOrder}. ${m.title}
                        <span class="movie-year">${m.year}</span>
                    </h3>
                </div>
                <div class="info-panel">
                    <p class="director-info"><strong>監督:</strong> ${m.director}<br><span>${m.director_note}</span></p>
                    <p><strong>制作国:</strong> ${m.category}</p>
                    <p><strong>特徴:</strong> ${m.features}</p>
                    <div style="margin-top: 15px; display: flex; gap: 10px;">
                        <a href="https://www.amazon.co.jp/s?k=${encodeURIComponent(m.title)}" target="_blank" style="color: var(--cyan); text-decoration: none; border: 1px solid var(--cyan); padding: 5px 10px; border-radius: 5px; font-size: 0.75rem;">🔗 Prime Video</a>
                        <a href="https://filmarks.com/search/movies?q=${encodeURIComponent(m.title)}" target="_blank" style="color: #fff; text-decoration: none; border: 1px solid #444; padding: 5px 10px; border-radius: 5px; font-size: 0.75rem; background: #222;">⭐ Filmarks</a>
                    </div>
                </div>
                <div class="img-container">
                    <img src="${m.image}" alt="${m.title}" onerror="this.src='https://via.placeholder.com/900x500/111/fff?text=${m.title}'">
                </div>
            `;
            listDiv.appendChild(section);

            // タイル画像の追加
            const tileImg = document.createElement('img');
            tileImg.src = m.image;
            tileImg.alt = m.title;
            tileImg.title = m.title; // ホバーでタイトル表示
            tileImg.onerror = function() { this.src='https://via.placeholder.com/900x500/111/fff?text=' + encodeURIComponent(m.title); };
            tileImg.onclick = function() { scrollToRank(m.order); };
            allMoviesGrid.appendChild(tileImg);
        });

        // タイトルの更新
        const count = movies.filter(m => m.order <= 30).length;
        document.getElementById('dynamic-title').innerHTML = `魂を揺さぶる映画${count}選：<br>暴力、静寂、そして実存`;
        document.title = `vol.24 魂を揺さぶる映画${count}選 - ストップモーションアニメ通信`;

        // 全映画数の表示
        document.getElementById('total-movies-count').textContent = `全 ${movies.length} 作品アーカイブ`;

    } catch (e) {
        console.error("Data Load Error:", e);
        document.getElementById('category-list').textContent = "データの読み込みに失敗しました。サーバーが起動しているか確認してください。";
    }
}
init();

function scrollToRank(rank) {
    let el = document.querySelector(`[data-rank="${rank}"]`);
    if (!el) {
        const allCards = document.querySelectorAll('.movie-card');
        if (allCards.length > 0) {
            el = allCards[allCards.length - 1];
        }
    }
    if (el) {
        el.scrollIntoView({ behavior: 'smooth' });
    }
}
</script>
