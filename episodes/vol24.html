<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta property="og:title" content="vol.24 魂を揺さぶる映画選 - ストップモーションアニメ通信">
    <meta property="og:description" content="厳選された映画ガイド。AI管理システムによる最新アーカイブ。">
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://hamagoro.github.io/my-animation-site/episodes/vol24.html">
    <meta property="og:image" content="https://hamagoro.github.io/my-animation-site/images/vol24/main.webp">
    <link rel="icon" href="../images/logo2.webp" type="image/webp">

    <title>vol.24 魂を揺さぶる映画選 - ストップモーションアニメ通信</title>
    <link rel="stylesheet" href="../style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { --cyan: #00f2ff; --magenta: #ff00ff; --bg: #000; --panel: #111; }
        body { background-color: var(--bg); color: #fff; line-height: 1.6; margin: 0; }
        
        /* 全体レイアウト */
        .episode-container { max-width: 900px; margin: 0 auto; padding: 40px 20px; text-align: left; }
        
        /* ヘッダー */
        .episode-header { margin-bottom: 60px; }
        .episode-header h2 { font-size: 2.8rem; border-left: 8px solid var(--cyan); padding-left: 20px; text-shadow: 0 0 15px rgba(0,242,255,0.4); margin: 10px 0; line-height: 1.2; }

        /* --- グラフエリアの修正 --- */
        .chart-section {
            display: flex;
            flex-direction: column; /* 縦に並べる */
            align-items: center;    /* 中央寄せ */
            gap: 30px;              /* グラフ同士の間隔 */
            margin-bottom: 50px;
        }

        .chart-box {
            width: 100%;
            max-width: 450px;       /* 👈 グラフの最大幅（小さく設定） */
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 20px;
        }

        canvas { width: 100% !important; height: auto !important; }

        /* 統計テキスト */
        #stat-panel { 
            width: 100%; 
            margin-bottom: 20px; 
            padding: 15px; 
            background: #0a0a0a; 
            border: 1px solid var(--cyan); 
            border-radius: 10px; 
            font-size: 0.85rem; 
            box-sizing: border-box;
        }

        /* 目次 */
        #movie-index { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px;
            padding: 20px; background: var(--panel); border: 1px dashed var(--magenta); border-radius: 15px; margin-bottom: 50px;
        }
        #movie-index a { color: #ccc; text-decoration: none; font-size: 0.85rem; transition: 0.2s; }
        #movie-index a:hover { color: var(--cyan); }

        /* 作品カード */
        .movie-card { margin-bottom: 100px; scroll-margin-top: 50px; }
        .card-header { border-bottom: 2px solid var(--cyan); margin-bottom: 20px; }
        .card-header.alt { border-bottom: 2px solid var(--magenta); }
        .card-header h3 { font-size: 1.8rem; margin: 10px 0; }

        .info-panel { background: var(--panel); padding: 25px; border-radius: 12px; border-left: 5px solid #333; margin-bottom: 25px; }
        .director-info span { color: #888; font-size: 0.9rem; }
        .movie-year { display: inline-block; background: #333; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; margin-left: 10px; vertical-align: middle; }
        
        .img-container img { width: 100%; border-radius: 15px; border: 1px solid #222; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        .scroll-btn { position: fixed; right: 30px; background: var(--panel); color: var(--cyan); 
                   border: 1px solid var(--cyan); width: 45px; height: 45px; border-radius: 50%; text-decoration: none; font-size: 1.2rem; z-index: 1000; display: flex; justify-content: center; align-items: center; transition: 0.3s; }
        .scroll-btn:hover { background: var(--cyan); color: #000; }
        .top-btn { bottom: 85px; }
        .bottom-btn { bottom: 30px; }
    </style>
</head>
<body>

    <header class="main-header">
        <img src="../images/logo.webp" alt="The Animeda! Project" class="header-logo">
        <h1 class="header-title">ストップモーションアニメ通信</h1>
        <p class="header-subtitle">物質と魂が交差する、1fpsのアーカイブ</p>
    </header>

    <nav style="padding: 10px; display: flex; justify-content: space-between; font-weight: bold; max-width: 900px; margin: 0 auto; border-bottom: 1px solid #333; font-size: 0.8rem;">
        <a href="../index.html" style="color: #00f2ff; text-decoration: none;">← BACK TO INDEX</a>
        <div>
            <a href="vol23.html" style="color: #ff00ff; text-decoration: none; margin-right: 10px;">← 前のVol.23へ</a>
            <a href="#" style="color: #444; text-decoration: none;">次のVol.25へ →</a>
        </div>
    </nav>

    <article class="episode-container">
        
        <header class="episode-header">
            <p style="color: var(--magenta); font-weight: bold;">Vol.24 / Cinema Selection Special</p>
            <h2 id="dynamic-title">魂を揺さぶる映画選</h2>
            <p style="color: #888; margin-top: 15px;">2026.04.30 UP / Curated by hamagoro</p>
        </header>

        <div id="stat-panel">
            <strong>🌍 収録作品分布：</strong> <span id="category-list" style="color: #ccc;">Loading...</span>
        </div>

        <div class="chart-section">
            <div class="chart-box">
                <canvas id="countryChart"></canvas>
            </div>
            <div class="chart-box">
                <canvas id="yearChart"></canvas>
            </div>
        </div>

        <nav id="movie-index"></nav>

        <div id="movie-list"></div>

    </article>

    <a href="#" class="scroll-btn top-btn">↑</a>
    <a href="#footer" class="scroll-btn bottom-btn">↓</a>

    <footer id="footer" class="main-footer" style="padding: 80px 20px; text-align: center; border-top: 4px solid #ff00ff; background: #000; margin-top: 100px;">
        <img src="../images/logo.webp" alt="Logo" class="footer-logo" style="max-width: 180px; margin-bottom: 20px;">
        <p class="footer-credit" style="color: #00f2ff; font-weight: 900;">© 2026 The Animeda! Project</p>
    </footer>

<script>
async function init() {
    try {
        // データの読み込み
        const res = await fetch('movies.json');
        if (!res.ok) throw new Error('JSON load failed');
        const movies = await res.json();
        
        // --- 1. データ集計 ---
        const countryStats = {};
        const decadeStats = {};
        
        movies.forEach(m => {
            countryStats[m.category] = (countryStats[m.category] || 0) + 1;
            const decade = Math.floor(m.year / 10) * 10 + "s";
            decadeStats[decade] = (decadeStats[decade] || 0) + 1;
        });

        document.getElementById('category-list').textContent = 
            Object.entries(countryStats).map(([k, v]) => `【${k}】${v}`).join('、');

        // --- 2. グラフ描画 (Chart.js) ---
        Chart.defaults.color = '#ccc';

        // 国別円グラフ
        new Chart(document.getElementById('countryChart'), {
            type: 'doughnut',
            data: {
                labels: Object.keys(countryStats),
                datasets: [{
                    data: Object.values(countryStats),
                    backgroundColor: ['#00f2ff', '#ff00ff', '#7000ff', '#00ff70', '#fff', '#444'],
                    borderWidth: 0
                }]
            },
            options: { 
                aspectRatio: 1.2,
                plugins: { title: { display: true, text: '国別シェア', color: '#00f2ff', font: {size: 16} } }
            }
        });

        // 年代別棒グラフ
        const sortedDecades = Object.keys(decadeStats).sort();
        new Chart(document.getElementById('yearChart'), {
            type: 'bar',
            data: {
                labels: sortedDecades,
                datasets: [{
                    label: '作品数',
                    data: sortedDecades.map(d => decadeStats[d]),
                    backgroundColor: '#ff00ff'
                }]
            },
            options: {
                aspectRatio: 1.2,
                plugins: { title: { display: true, text: '年代別分布', color: '#ff00ff', font: {size: 16} }, legend: { display: false } },
                scales: { y: { beginAtZero: true, grid: { color: '#222' } }, x: { grid: { display: false } } }
            }
        });

        // --- 3. リスト生成 ---
        const indexNav = document.getElementById('movie-index');
        const listDiv = document.getElementById('movie-list');

        movies.forEach((m, i) => {
            const isEven = i % 2 !== 0;
            const themeColor = isEven ? 'var(--magenta)' : 'var(--cyan)';

            const displayOrder = m.order === 999 ? "次点" : String(m.order).padStart(2, '0');

            // 目次
            const idxLink = document.createElement('a');
            idxLink.href = `#m${m.id}`;
            idxLink.textContent = `${displayOrder}. ${m.title}`;
            indexNav.appendChild(idxLink);

            // カード
            const section = document.createElement('section');
            section.className = 'movie-card';
            section.id = `m${m.id}`;
            section.innerHTML = `
                <div class="card-header ${isEven ? 'alt' : ''}">
                    <h3 style="color: ${themeColor}">
                        ${displayOrder}. ${m.title}
                        <span class="movie-year">${m.year}</span>
                    </h3>
                </div>
                <div class="info-panel">
                    <p class="director-info"><strong>監督:</strong> ${m.director}<br><span>${m.director_note}</span></p>
                    <p><strong>特徴:</strong> ${m.features}</p>
                    <div style="margin-top: 15px; display: flex; gap: 10px;">
                        <a href="https://www.amazon.co.jp/s?k=${encodeURIComponent(m.title)}" target="_blank" style="color: var(--cyan); text-decoration: none; border: 1px solid var(--cyan); padding: 5px 10px; border-radius: 5px; font-size: 0.75rem;">🔗 Prime Video</a>
                        <a href="https://filmarks.com/search/movies?q=${encodeURIComponent(m.title)}" target="_blank" style="color: #fff; text-decoration: none; border: 1px solid #444; padding: 5px 10px; border-radius: 5px; font-size: 0.75rem; background: #222;">⭐ Filmarks</a>
                    </div>
                </div>
                <div class="img-container">
                    <img src="${m.image}" alt="${m.title}" onerror="this.src='https://via.placeholder.com/900x500/111/fff?text=${m.title}'">
                </div>
            `;
            listDiv.appendChild(section);
        });

        // タイトルの更新
        const count = movies.filter(m => m.order !== 999).length;
        document.getElementById('dynamic-title').innerHTML = `魂を揺さぶる映画${count}選：<br>暴力、静寂、そして実存`;
        document.title = `vol.24 魂を揺さぶる映画${count}選 - ストップモーションアニメ通信`;

    } catch (e) {
        console.error("Data Load Error:", e);
        document.getElementById('category-list').textContent = "データの読み込みに失敗しました。サーバーが起動しているか確認してください。";
    }
}
init();
</script>

</body>
</html>
