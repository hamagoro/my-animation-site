    <style>
        body { margin: 0; padding: 0; background-color: #f4f4f9; font-family: 'Helvetica Neue', Arial, sans-serif; color: #333; }
        .sample-nav { background: #111; padding: 12px 10px; text-align: center; font-size: 0.85rem; line-height: 2; border-bottom: 2px solid #00f2ff; }
        .sample-nav.bottom { border-bottom: none; border-top: 2px solid #00f2ff; margin-top: 40px; }

        header { text-align: center; padding: 40px 20px; background: #222; color: #fff; }
        .gallery-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 40px; max-width: 1000px; margin: 0 auto; }
        .gallery-item { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.3s ease, box-shadow 0.3s ease; cursor: pointer; }
        .gallery-item:hover { transform: translateY(-10px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .gallery-item img { width: 100%; height: 200px; object-fit: cover; display: block; }
        .item-info { padding: 15px; text-align: center; font-weight: bold; }
